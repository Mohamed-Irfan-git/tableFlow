services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tableflow
      POSTGRES_USER: tableflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - tableflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tableflow -d tableflow"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  tableflow_postgres:
